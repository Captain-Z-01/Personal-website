<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="AboutMe" />
<title>Tentang Saya</title>

<style>
:root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --text:#1e293b;
    --sub:#64748b;
    --accent:#2563eb;
    --border:#e5e7eb;
}

body.dark{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --sub:#94a3b8;
    --accent:#60a5fa;
    --border:#334155;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    transition:.3s;
    line-height:1.8;
}

header{
    position:sticky;
    top:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    z-index:100;
}

button{
    border:none;
    background:var(--accent);
    color:#fff;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

.container{
    max-width:760px;
    margin:auto;
    padding:25px 18px 50px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px;
}

h1{
    margin-bottom:8px;
}

small{
    color:var(--sub);
    display:block;
    margin-bottom:20px;
}

p{
    margin-bottom:20px;
}

.loading{
    text-align:center;
    color:var(--sub);
}

footer{
    text-align:center;
    color:var(--sub);
    margin-top:25px;
    font-size:14px;
}
</style>
</head>
<body>

<header>

<button onclick="location.href='../'">
← Kembali
</button>

<button onclick="toggleTheme()">
Tema ◑
</button>

</header>

<div class="container">

<div class="card">

<div id="content" class="loading">
Memuat...
</div>

</div>

</div>

<script>
function toggleTheme(){
    document.body.classList.toggle("dark");

    localStorage.setItem(
        "Captain_Z-MD.theme",
        document.body.classList.contains("dark")
            ? "dark"
            : "light"
    );
}

if(localStorage.getItem("Captain_Z-MD.theme")==="dark"){
    document.body.classList.add("dark");
}

fetch("sptfiles/aboutz.captz")
.then(res=>{
    if(!res.ok) throw new Error("Gagal");
    return res.text();
})
.then(text=>{

    // Pisahkan berdasarkan baris kosong
    let bagian = text.trim().split(/\n\s*\n/);

    let html="";

    if(bagian.length>=2){
        html += `<h1>${bagian[0]}</h1>`;
        html += `<small>${bagian[1]}</small>`;

        for(let i=2;i<bagian.length;i++){
            html += `<p>${bagian[i].replace(/\n/g,"<br>")}</p>`;
        }
    }else{
        html = `<p>${text.replace(/\n/g,"<br>")}</p>`;
    }

    html += `
    <footer>
        Terima kasih telah berkunjung ❤️
    </footer>
    `;

    document.getElementById("content").innerHTML = html;

})
.catch(()=>{
    document.getElementById("content").innerHTML=`
        <h2>Gagal memuat data</h2>
        <p>Coba lagi nanti, mungkin memerlukan beberapa menit</p>
    `;
});
</script>

</body>
</html>
