<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Captain Z</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Poppins",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    color:#fff;
    background:
        radial-gradient(circle at top,#243b55 0%,#141e30 45%,#0b1120 100%);
    overflow:hidden;
}

/* Background Glow */
body::before,
body::after{
    content:"";
    position:fixed;
    width:380px;
    height:380px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.25;
    z-index:-1;
}

body::before{
    background:#3b82f6;
    top:-120px;
    left:-120px;
}

body::after{
    background:#06b6d4;
    bottom:-120px;
    right:-120px;
}

.card{
    width:100%;
    max-width:720px;
    padding:45px;
    border-radius:28px;
    text-align:center;

    

    animation:fadeUp .8s ease;
}

/* Foto Profil */
.profile-logo{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:18px;
}

.profile-logo img{
    width:105px;
    height:105px;
    border-radius:50%;
    object-fit:cover;
    display:block;

    border:3px solid rgba(255,255,255,.15);

    box-shadow:
        0 0 30px rgba(59,130,246,.22),
        0 12px 35px rgba(0,0,0,.35);

    transition:.35s;
}

.profile-logo img:hover{
    transform:scale(1.05);
    box-shadow:
        0 0 40px rgba(59,130,246,.35),
        0 15px 40px rgba(0,0,0,.4);
}

.badge{
    display:inline-block;
    padding:7px 18px;
    border-radius:999px;
    margin-bottom:22px;

    background:rgba(59,130,246,.12);
    border:1px solid rgba(59,130,246,.3);

    color:#9ecbff;
    font-size:.85rem;
    font-weight:600;
}

h1{
    font-size:2rem;
    margin-bottom:12px;
}

.desc{
    color:#c9d3df;
    line-height:1.8;
    margin-bottom:32px;
}

.box{
    padding:24px;
    margin-bottom:34px;
    border-radius:18px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
}

.box h2{
    margin-bottom:10px;
    font-size:1.2rem;
}

.box p{
    color:#bcc7d6;
    line-height:1.7;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:14px 28px;
    border-radius:14px;
    font-weight:600;
    transition:.25s;
}

.btn-primary{
    color:#fff;
    background:linear-gradient(135deg,#2563eb,#3b82f6);

    box-shadow:0 10px 25px rgba(37,99,235,.3);
}

.btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 35px rgba(37,99,235,.4);
}

.btn-secondary{
    color:#fff;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.08);
}

.btn-secondary:hover{
    background:rgba(255,255,255,.12);
    transform:translateY(-3px);
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:600px){

.card{
    padding:30px 24px;
}

h1{
    font-size:1.6rem;
}

.profile-logo img{
    width:90px;
    height:90px;
}

.buttons{
    flex-direction:column;
}

.btn{
    width:100%;
}

}
</style>
</head>

<body>

<div class="card">

    <div class="profile-logo">
        <img src="https://avatars.githubusercontent.com/u/308199074?v=4"
             alt="Captain Z">
    </div>

    <span class="badge">Captain Z • GitHub Profile</span>

    <h1>Halo 👋</h1>

    <p class="desc">
        Sebelumnya Anda sedang berada di halaman GitHub <strong>Captain Z</strong>.
        Sekarang Anda telah diarahkan ke halaman ini untuk memberikan pengalaman yang lebih modern, nyaman, dan informatif.
    </p>

    <div class="buttons">

        <a href="index.html" class="btn btn-primary">
            ← Kembali
        </a>

        <a href="https://wa.me/6285921299248?text=Assalamualaikum" class="btn btn-secondary">
            Tinggalkan pesan
        </a>

    </div>

</div>

</body>
</html>
