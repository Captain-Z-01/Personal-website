<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="description" content="GitHub Captain Z — tempat berbagai project luar biasa dikembangkan dan di-host." />
  <meta name="keywords" content="Captain Z, GitHub, project, web developer, repository"/>
  <meta name="author" content="Yahya Zakaria / Captain Z" />
  <meta property="og:title" content="GitHub | Captain Z" />
  <meta property="og:description" content="GitHub sebagai tempat berbagai project Captain Z dikembangkan dan di-host."/>
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/308199074?v=4" />
  <title>GitHub | Captain Z</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f8fa;
      --text: #17191d;
      --muted: #747982;
      --border: rgba(0, 0, 0, 0.08);
      --accent: #111827;
      --button-text: #ffffff;
    }

    html.dark {
      --bg: #0c0e12;
      --text: #f3f4f6;
      --muted: #969ca7;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #f3f4f6;
      --button-text: #000000;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      font-family: "Nunito", sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);

      transition:
        background 0.3s ease,
        color 0.3s ease;

      overflow: hidden;
    }

    .background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .background::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      top: -180px;
      right: -130px;
      border-radius: 50%;
      background: rgba(120, 130, 150, 0.08);
      filter: blur(10px);
    }

    .background::after {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      bottom: -180px;
      left: -140px;
      border-radius: 50%;
      background: rgba(120, 130, 150, 0.06);
      filter: blur(10px);
    }

    .github-card {
      width: min(100%, 440px);
      padding: 38px 30px 28px;
      text-align: center;
      animation: appear 0.7s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 25px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .description {
      max-width: 340px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      font-weight: 500;
    }

    .github-icon {
      width: 48px;
      height: 48px;
      margin: 22px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--text);
      font-size: 25px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.55;
        transform: scale(0.95);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .github-link {
      margin-top: 27px;
    }

    .github-button {
      width: 100%;
      min-height: 45px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      border-radius: 13px;
      background: var(--accent);
      color: var(--button-text);

      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .github-button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .github-button:active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.6;
    }

    footer strong {
      color: var(--text);
      font-weight: 700;
    }

    .datetime {
      margin-top: 3px;
      font-size: 10px;
      color: var(--muted);
      opacity: 0.85;
    }

    .copyright {
      margin-top: 4px;
    }

    @media (max-width: 420px) {
      body {
        padding: 17px;
      }

      .github-card {
        padding: 32px 22px 24px;
      }

      h1 {
        font-size: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <main class="github-card">
    <div class="eyebrow">GITHUB</div>
    <h1>Tempat Project Dikembangkan</h1>
    <p class="description">
      GitHub menjadi tempat Captain Z mengembangkan,
      menyimpan, dan meng-host berbagai project
      luar biasa yang sedang maupun telah dibuat.
    </p>
    <div class="github-link">
      <a
        href="https://github.com/Captain-Z-01"
        class="github-button"
        target="_blank"
        rel="noopener noreferrer"
      >
        Kunjungi GitHub
      </a>
    </div>
  </main>
  <script>
    (() => {
      const THEME_KEY = "Captain_Z-MD.theme";
      const root = document.documentElement;

      function applyTheme() {
        const savedTheme = localStorage.getItem(THEME_KEY);

        root.classList.remove("dark");

        if (savedTheme === "dark") {
          root.classList.add("dark");
        } else if (savedTheme === "light") {
        } else {
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;

          if (prefersDark) {
            root.classList.add("dark");
          }
        }
      }

      applyTheme();

      const mediaQuery = window.matchMedia(
        "(prefers-color-scheme: dark)"
      );

      mediaQuery.addEventListener("change", () => {
        const savedTheme = localStorage.getItem(THEME_KEY);

        if (!savedTheme || savedTheme === "auto") {
          applyTheme();
        }
      });
    })();
  </script>
</body>
</html>
