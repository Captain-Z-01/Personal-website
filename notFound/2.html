<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="description" content="Project Captain Z yang masih dalam proses pengembangan." />
  <meta name="keywords" content="Captain Z, project, development, personal website"/>
  <meta name="author" content="Yahya Zakaria / Captain Z" />
  <meta property="og:title" content="Development | Captain Z" />
  <meta property="og:description" content="Project Captain Z yang masih dalam proses pengembangan."/>
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="/favicon.ico" />
  <title>Captain Z | Personal Website</title>
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/308199074?v=4" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f8fa;
      --text: #17191d;
      --muted: #747982;
      --border: rgba(0, 0, 0, 0.08);
      --accent: #111827;
      --button-text: #ffffff;
    }

    html.dark {
      --bg: #0c0e12;
      --text: #f3f4f6;
      --muted: #969ca7;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #f3f4f6;
      --button-text: #000000;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      font-family: "Nunito", sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);

      transition:
        background 0.3s ease,
        color 0.3s ease;

      overflow: hidden;
    }

    .background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .background::before {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      top: -180px;
      right: -130px;
      border-radius: 50%;
      background: rgba(120, 130, 150, 0.08);
      filter: blur(10px);
    }

    .background::after {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      bottom: -180px;
      left: -140px;
      border-radius: 50%;
      background: rgba(120, 130, 150, 0.06);
      filter: blur(10px);
    }

    .development-card {
      width: min(100%, 440px);
      padding: 38px 30px 28px;
      text-align: center;
      animation: appear 0.7s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      margin-bottom: 12px;
      font-size: 25px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .description {
      max-width: 340px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      font-weight: 500;
    }


    .back {
      margin-top: 27px;
    }

    .back-button {
      width: 100%;
      min-height: 45px;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;
      background: transparant;
      color: var(--text);

      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .back-button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .back-button:active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.6;
    }

    footer strong {
      color: var(--text);
      font-weight: 700;
    }

    .datetime {
      margin-top: 3px;
      font-size: 10px;
      color: var(--muted);
      opacity: 0.85;
    }

    .copyright {
      margin-top: 4px;
    }

    @media (max-width: 420px) {
      body {
        padding: 17px;
      }

      .development-card {
        padding: 32px 22px 24px;
      }

      h1 {
        font-size: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <main class="development-card">
    <h1>Project sedang dikembangkan</h1>
    <p class="description">
      Beberapa project Captain Z masih dalam proses
      pengembangan dan belum tersedia untuk digunakan.
      Halaman ini akan diperbarui setelah project
      tersebut selesai.
    </p>
    <div class="back">
      <a href="/" class="back-button">
        Kembali ke Beranda
      </a>
    </div>

    <footer>
      <div> Website pribadi <a href="https://captain-z.pages.dev/">Captain Z</a>
      </div>
      <div class="copyright">
        © <span id="year"></span> Captain_Z MD. All rights reserved.
      </div>
      <div class="datetime" id="datetime"></div>
    </footer>
  </main>
  <script>
    (() => {
      const THEME_KEY = "Captain_Z-MD.theme";
      const root = document.documentElement;

      function applyTheme() {
        const savedTheme = localStorage.getItem(THEME_KEY);

        root.classList.remove("dark");

        if (savedTheme === "dark") {
          root.classList.add("dark");
        } else if (savedTheme === "light") {
        } else {
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;

          if (prefersDark) {
            root.classList.add("dark");
          }
        }
      }

      applyTheme();

      const mediaQuery = window.matchMedia(
        "(prefers-color-scheme: dark)"
      );

      mediaQuery.addEventListener("change", () => {
        const savedTheme = localStorage.getItem(THEME_KEY);

        if (!savedTheme || savedTheme === "auto") {
          applyTheme();
        }
      });

      document.getElementById("year").textContent =
        new Date().getFullYear();
    })();

    function updateDateTime() {
      const now = new Date();

      const date = now.toLocaleDateString("id-ID", {
        day: "2-digit",
        month: "long",
        year: "numeric"
      });

      const time = now.toLocaleTimeString("id-ID", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      document.getElementById("datetime").textContent =
        `${date} • ${time}`;
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);
  </script>

</body>
</html>
