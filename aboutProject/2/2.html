<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Project</title>

<style>
:root{
    --bg:#08111f;
    --card:#101b2f;
    --text:#ffffff;
    --muted:#b9c2d0;
    --border:rgba(255,255,255,.08);
    --accent:#58a6ff;
}

/* Light */
html[data-theme="light"]{
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#1d2939;
    --muted:#667085;
    --border:#d9e1ea;
    --accent:#2563eb;
}

/* Forest */
html[data-theme="forest"]{
    --bg:#0f1f17;
    --card:#162a20;
    --text:#edfdf3;
    --muted:#b7d7c3;
    --border:#2a4b39;
    --accent:#39d98a;
}

/* Sunset */
html[data-theme="sunset"]{
    --bg:#2a1b16;
    --card:#3a241d;
    --text:#fff3eb;
    --muted:#e4c8b8;
    --border:#65463b;
    --accent:#ff9d5c;
}

/* Lavender */
html[data-theme="lavender"]{
    --bg:#19172b;
    --card:#25213f;
    --text:#f2efff;
    --muted:#c8c0e8;
    --border:#453f69;
    --accent:#9d8cff;
}

/* Midnight */
html[data-theme="midnight"]{
    --bg:#08111f;
    --card:#101b2f;
    --text:#ffffff;
    --muted:#b9c2d0;
    --border:rgba(255,255,255,.08);
    --accent:#58a6ff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:20px;
}

.card{
    max-width:900px;
    margin:auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
}

h1{
    color:var(--accent);
    margin-bottom:15px;
}

#content{
    white-space:pre-wrap;
    line-height:1.8;
    color:var(--muted);
}
</style>
</head>
<body>

<div class="card">
    <h1>About Project</h1>
    <div id="content">Memuat informasi...</div>
</div>

<script>
// Terapkan tema
const theme = localStorage.getItem("Captain_Z-MD.theme") || "midnight";
document.documentElement.setAttribute("data-theme", theme);

// Ambil isi file TXT
fetch("2.txt") 
.then(res => {
    if(!res.ok) throw new Error();
    return res.text();
})
.then(text => {
    document.getElementById("content").textContent = text;
})
.catch(() => {
    document.getElementById("content").textContent =
    "Gagal memuat aboutProject.txt";
});
</script>

</body>
</html>
